    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var overrideFetch = null;
            var origGet = desc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: Boolean(desc.enumerable),
              get: function () {
                return overrideFetch || origGet.call(window);
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  overrideFetch = nextFetch;
                }
              },
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && event.message) || '';
            var file = (event && event.filename) || '';
            var stack =
              (event && event.error && typeof event.error.stack === 'string' && event.error.stack) ||
              '';
            var isExtension =
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0 ||
              file.indexOf('safari-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('moz-extension://') !== -1;
            if (isExtension && msg.indexOf('Cannot set property fetch') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
